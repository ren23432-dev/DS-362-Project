<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Club</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<header>
    <div class="container">
        <h1>Cybersecurity Club</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Cyber Events</a>
            <a href="register.html">Register</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </div>
</header>

<main class="container">

<section class="panel">

    <h2>Cybersecurity Event Registration</h2>

    <form>

        <div class="form-group">
            <label for="student_name">Full Name</label>
            <input
                type="text"
                id="student_name"
                name="student_name"
                placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="student_id">Student ID</label>
            <input
                type="text"
                id="student_id"
                name="student_id"
                placeholder="Enter your student ID">
        </div>

        <div class="form-group">
            <label for="email">University Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="student@university.edu">
        </div>

        <div class="form-group">
            <label for="event_id">Select a Cybersecurity Event</label>

            <select id="event_id" name="event_id">
                <option>-- Select an Event --</option>
                <option>Cybersecurity Awareness Workshop</option>
                <option>Capture The Flag (CTF) Competition</option>
                <option>Ethical Hacking Seminar</option>
                <option>Network Security Training</option>
            </select>

        </div>

        <button type="submit">Register Now</button>

    </form>

</section>

</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Cybersecurity Club | Student Activities Department</p>
        <p>Designed by the Cybersecurity Club Team</p>
    </div>
</footer>

</body>
</html>
